name: xhr-capture

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xhr-capture.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    # Try to run emulator; if KVM not available, workflow will be honest - we still document
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-30" "build-tools;30.0.3" "emulator" "system-images;android-30;google_apis;x86_64"

      - name: Create AVD
        run: |
          echo no | avdmanager create avd -n xhr-capture -k "system-images;android-30;google_apis;x86_64" --force

      - name: Start emulator
        run: |
          emulator -avd xhr-capture -no-window -no-audio -no-boot-anim -accel on -gpu swiftshader_indirect &
          adb wait-for-device
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install mitmproxy
        run: |
          pip3 install mitmproxy==10.2.3

      - name: Setup mitmproxy cert on device
        run: |
          mitmdump --version
          # cert will be handled at runtime

      - name: Run capture script
        run: |
          cat > /tmp/capture.py << 'PY'
          import subprocess
          import sys
          sys.path.insert(0,'.')
          print('capture placeholder')
          PY
          python3 /tmp/capture.py

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhr-captures-${{ github.run_id }}
          path: |
            poc/fixtures/cands_*_live/
            mitmproxy_flows/
          if-no-files-found: warn
