name: debug-apk

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: generate the offline asset (same one the gate saw)
        run: |
          python3 scripts/build_offline_asset.py
          mkdir -p app/src/main/assets
          cp data/asset.json app/src/main/assets/offline_asset.json

      - name: build debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: report what this PROVED
        run: |
          echo "PROVED: the app compiles and a debug APK exists. Nothing here is a claim about"
          echo "sources, data or behaviour on the owner's phone."
          ls -l app/build/outputs/apk/debug/

      - name: upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: publish rolling latest-apk release (11.3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest-apk
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "rolling debug APK - permanent install link" \
              --notes "Rolling debug build from CI. Install with 'unknown sources' allowed."
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh release upload "$TAG" "$APK#app-debug.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "PROVED: published app-debug.apk size=${SIZE} date=${DATE} (READ from this run, not assumed)" | tee -a "$GITHUB_STEP_SUMMARY"
