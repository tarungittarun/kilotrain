name: core-unit-tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: install Android SDK components
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        shell: bash

      - name: generate offline asset + gate
        run: |
          python3 scripts/build_offline_asset.py
          python3 scripts/known_truths_gate.py
          mkdir -p app/src/main/assets
          cp data/asset.json app/src/main/assets/offline_asset.json

      - name: :core:test (L1)
        run: ./gradlew :core:test --console=plain --stacktrace

      - name: upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-tests-${{ github.run_id }}
          path: core/build/reports/tests/
          if-no-files-found: warn
