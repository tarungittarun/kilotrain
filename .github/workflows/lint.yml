name: lint

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: install Android SDK components
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        shell: bash

      - name: generate offline asset
        run: |
          python3 scripts/build_offline_asset.py
          mkdir -p app/src/main/assets
          cp data/asset.json app/src/main/assets/offline_asset.json

      - name: lint debug (fail on errors)
        run: ./gradlew :app:lintDebug --console=plain --stacktrace

      - name: compile debug (fail on errors)
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --console=plain --stacktrace

      - name: compile core (fail on errors)
        run: ./gradlew :core:compileKotlin :core:compileJava --console=plain --stacktrace
