name: Multi-Source Train Data Validation

on:
  push:
    branches: ["kilo/patient-lantern-jgg"]
  schedule:
    - cron: "0 * * * *"  # Run every hour
  workflow_dispatch:

jobs:
  multi-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        run_id: [1, 2, 3, 4, 5, 6]  # 6 runs over 30 minutes (every 5 min)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run multi-source test (run ${{ matrix.run_id }}/6)
        run: |
          python test_sources/test_multi_source.py
        env:
          RUN_ID: ${{ matrix.run_id }}
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-run-${{ matrix.run_id }}
          path: test_sources/results/
          retention-days: 7
      
      - name: Print summary
        run: |
          echo "Test run ${{ matrix.run_id }} completed at $(date)"
          ls -la test_sources/results/ 2>/dev/null || echo "No results yet"

  summary-report:
    needs: multi-source-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test_results/
      
      - name: Generate summary report
        run: |
          echo "=== MULTI-SOURCE TEST SUMMARY ==="
          echo "Date: $(date)"
          echo ""
          ls -la test_results/ 2>/dev/null || echo "No results downloaded"
          echo ""
          echo "Checking each source across all runs..."
          for result_file in test_results/run-*/test_results_*.json; do
            if [ -f "$result_file" ]; then
              echo "Results from: $result_file"
              python3 -c "
import json, sys
with open('$result_file') as f:
    data = json.load(f)
for source in ['WIMT', 'RailYatri', 'RailRadar.in', 'RunningStatus.in', 'erail.in']:
    src = [r for r in data if r.get('source') == source]
    passed = len([r for r in src if r.get('status_code') == 200])
    actuals = len([r for r in src if r.get('has_actuals') == True])
    print(f'  {source}: {passed}/{len(src)} passed, {actuals} with actuals')
"
          done