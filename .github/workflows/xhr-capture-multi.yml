name: xhr-capture-multi

on:
  workflow_dispatch:

jobs:
  capture:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: KVM check (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -e /dev/kvm ]; then echo "kvm=1"; else echo "kvm=0"; fi

      - name: Install mitmproxy
        run: |
          python3 -m pip install --upgrade pip
          pip install mitmproxy==10.2.3

      - name: Prepare dirs
        shell: bash
        run: |
          mkdir -p mitmproxy_flows poc/fixtures/cands_confirmtkt_live poc/fixtures/cands_railyatri_live poc/fixtures/cands_ixigo_live

      - name: Headless capture (180s)
        shell: bash
        run: |
      - name: Generate traffic to target sites
        shell: bash
        run: |
          mkdir -p /tmp/tgen
          for u in "https://www.railyatri.in/live-train-status/16228" "https://www.confirmtkt.com/train-running-status?trainNo=16228" "https://www.ixigo.com/trains/train-running-status?trainNo=16228"; do
            curl -s --connect-timeout 5 --max-time 10 "$u" > /dev/null 2>&1 || true
          done
          timeout 180 mitmdump --quiet --set confdir=/tmp/mc --save-stream-file mitmproxy_flows/flows.mitm 2>&1 | tail -3 || true &
          MPID=$!
          sleep 10
          # generate traffic in background while proxy runs
          for u in "https://www.railyatri.in/live-train-status/16228" "https://www.confirmtkt.com/train-running-status?trainNo=16228" "https://www.ixigo.com/trains/train-running-status?trainNo=16228"; do
            curl -s --connect-timeout 5 --max-time 15 -L -A "Mozilla/5.0" "$u" >/dev/null 2>&1 || true
            sleep 2
          done
          wait $MPID 2>&1 | tail -1 || true

      - name: Extract JSON from flows if present
        if: always()
        shell: bash
        run: |
          if [ -f mitmproxy_flows/flows.mitm ]; then
            mitmdump --read-flows mitmproxy_flows/flows.mitm > /tmp/flow_dump.txt 2>&1 || true
            head -c 300000 /tmp/flow_dump.txt > /tmp/flow_head.txt 2>&1 || true
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhr-captures-${{ matrix.os }}-${{ github.run_id }}
          path: |
            mitmproxy_flows/
            poc/fixtures/cands_*_live/
          if-no-files-found: warn
