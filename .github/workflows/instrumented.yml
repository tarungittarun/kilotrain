name: instrumented

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: instrumented jobs run in parallel
        run: |
          echo "L3/L4 emulator flows run in parallel split jobs:"
          echo "  - instrumented-install (install + launch)"
          echo "  - instrumented-navigation (navigation flows)"
          echo "Each has its own 8-min timeout and reports 'untested, with a reason' if KVM is absent."
          echo "No single job blocks the whole pipeline."
