name: xhr-capture-emulator

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-30" "build-tools;30.0.3" "emulator" "system-images;android-30;google_apis;x86_64"
      - name: Create AVD
        run: echo no | avdmanager create avd -n cap -k "system-images;android-30;google_apis;x86_64" --force
      - name: Install mitmproxy
        run: pip3 install mitmproxy==10.2.3
      - name: Prepare dirs
        run: mkdir -p mitmproxy_flows poc/fixtures/cands_confirmtkt_live poc/fixtures/cands_railyatri_live poc/fixtures/cands_ixigo_live
      - name: Start mitmproxy in background
        run: |
          mitmdump --listen-port 8888 --save-stream-file mitmproxy_flows/flows.mitm &
          echo $! > /tmp/mitm.pid
          sleep 5
      - name: Start emulator
        run: |
          emulator -avd cap -no-window -no-audio -no-boot-anim -accel on -gpu swiftshader_indirect &
          adb wait-for-device
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          sleep 10
      - name: Configure proxy on emulator
        run: |
          adb shell settings put global http_proxy 10.0.2.2:8888
          sleep 2
      - name: Install mitmproxy CA cert on emulator
        run: |
          mkdir -p /tmp/cert
          curl -s --proxy http://127.0.0.1:8888 http://mitm.it/cert/cer > /tmp/cert/mitm.cer 2>&1 || true
          adb push /tmp/cert/mitm.cer /sdcard/Download/mitm.cer 2>&1 || true
          adb shell am start -t "application/x-x509-ca-cert" -d "file:///sdcard/Download/mitm.cer" 2>&1 || true
          sleep 3
      - name: Generate traffic from emulator browser
        run: |
          adb shell am start -a android.intent.action.VIEW -d "https://www.railyatri.in/live-train-status/16228" com.android.chrome 2>&1 || adb shell am start -a android.intent.action.VIEW -d "https://www.railyatri.in/live-train-status/16228" 2>&1 || true
          sleep 10
          adb shell am start -a android.intent.action.VIEW -d "https://www.confirmtkt.com/train-running-status?trainNo=16228" 2>&1 || true
          sleep 10
          adb shell am start -a android.intent.action.VIEW -d "https://www.ixigo.com/trains/train-running-status?trainNo=16228" 2>&1 || true
          sleep 30
      - name: Stop
        if: always()
        run: |
          kill $(cat /tmp/mitm.pid 2>/dev/null) 2>&1 || true
          adb emu kill 2>&1 || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhr-captures-emulator-${{ github.run_id }}
          path: |
            mitmproxy_flows/
            poc/fixtures/cands_*_live/
          if-no-files-found: warn
