name: release

on:
  push:
    tags: ["2.*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: generate the offline asset
        run: |
          python3 scripts/build_offline_asset.py
          mkdir -p app/src/main/assets
          cp data/asset.json app/src/main/assets/offline_asset.json

      - name: check signing secrets (11.4)
        id: secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED, WITH A REASON: signing secrets are absent, so this job publishes the"
            echo "DEBUG artefact and says why release was skipped (11.4). The owner keeps their"
            echo "current APK; nothing here replaces it silently."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: build release APK (R8 + resource shrinking, 9.4)
        if: steps.secrets.outputs.present == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --console=plain --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          echo "PROVED: signed release size=$(stat -c%s "$APK") date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: "release skipped: secrets absent (11.4)"
        if: steps.secrets.outputs.present == 'false'
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: attach to the version tag + record size/date (11.6)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ steps.secrets.outputs.present }}" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
            NAME=app-release.apk
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
            NAME=app-debug.apk
          fi
          SIZE=$(stat -c%s "$APK"); DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "OpenTrack India $TAG"
          gh release upload "$TAG" "$APK#$NAME" --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "## $TAG"
            echo ""
            echo "- artefact: $NAME size=${SIZE} date=${DATE} (READ from this run)"
            echo "- on screen: ${TAG} ships the M1 honest cold start: labelled states, no fabricated rows"
            echo "- CI proved: unit-screens job + this release job; instrumented job reports its own verdict"
            echo "- still broken: M2 live pair search - blocked on a captured payload (ADR 0002)"
          } >> "$GITHUB_STEP_SUMMARY"
